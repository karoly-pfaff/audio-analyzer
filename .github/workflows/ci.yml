name: Library quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the recorded npm version
        run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify candidate, consumer, quality, coverage and documentation
        run: npm run check
      - name: Verify release candidate without publication
        run: npm run release:check
      - uses: actions/upload-artifact@v7
        with:
          name: audio-analyzer-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/karoly-pfaff-audio-analyzer-*.tgz
            artifacts/package-report.json
            docs/site/build/index.html
